[project]
name = "mailmind-capstone"
version = "1.0.0"
description = "MailMind Capstone — AI-powered email reply agent"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "openai==1.68.2",
    "anthropic==0.49.0",
    "langchain==0.3.20",
    "langchain-openai==0.3.7",
    "langchain-anthropic==0.3.10",
    "langgraph==0.3.18",
    "langsmith==0.3.15",
    "pinecone-client==5.0.1",
    "redis==5.1.1",
    "tavily-python==0.5.0",
    "apscheduler==3.10.4",
    "slowapi==0.1.9",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.149.0",
    "msal==1.31.0",
    "tiktoken==0.8.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "sse-starlette==2.1.3",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.2",
    "greenlet>=3.3.2",
    "bcrypt==4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black==24.8.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
