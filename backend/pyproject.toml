[project]
name = "mailmind-backend"
version = "2.0.0"
description = "MailMind AI Email Reply Agent — Capstone"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pydantic[email]>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9,<1.0.0",
    "openai>=1.35.0,<2.0.0",
    "anthropic>=0.30.0,<1.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain>=0.2.0,<1.0.0",
    "langchain-openai>=0.1.0,<1.0.0",
    "langsmith>=0.1.0,<1.0.0",
    "pinecone>=3.2.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "tavily-python>=0.3.0,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "email-validator>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
